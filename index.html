<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FUTCAREER — Modo Carreira</title>
<meta name="description" content="Jogo de carreira de futebol em um unico arquivo HTML.">
<style>
/* ==========================================================================
   FUTCAREER — identidade visual
   Paleta: gramado a noite sob holofotes.
   --night        #0A1620   fundo principal (tunel do estadio)
   --pitch        #163524   painel principal (gramado escuro)
   --pitch-light  #1F5138   painel secundario / hover
   --floodlight   #F2C744   destaque, botao principal, OVR
   --chalk        #EDF3EE   texto principal sobre fundo escuro
   --card-red     #E4572E   avisos, encerrar carreira
   ========================================================================== */

:root {
  --night: #0A1620;
  --pitch: #163524;
  --pitch-light: #1F5138;
  --floodlight: #F2C744;
  --chalk: #EDF3EE;
  --card-red: #E4572E;
  --linha: rgba(237, 243, 238, 0.14);
  --fonte-titulo: ui-sans-serif, "Segoe UI", Arial, sans-serif;
  --fonte-numero: ui-monospace, "SFMono-Regular", Consolas, monospace;
}

* { box-sizing: border-box; }

html, body {
  margin: 0;
  min-height: 100%;
  background: var(--night);
  color: var(--chalk);
  font-family: var(--fonte-titulo);
  line-height: 1.45;
}

#app {
  max-width: 780px;
  margin: 0 auto;
  padding: 24px 18px 60px;
}

h1, h2, h3 { font-weight: 700; margin: 0 0 12px; letter-spacing: -0.01em; }
h2 { font-size: 1.5rem; border-bottom: 1px solid var(--linha); padding-bottom: 10px; }
h3 { font-size: 1.05rem; color: var(--floodlight); margin-top: 22px; }
p { margin: 0 0 8px; }
ul { margin: 0 0 12px; padding-left: 20px; }
.texto-apoio { color: rgba(237, 243, 238, 0.65); font-size: 0.92rem; }
.destaque { color: var(--floodlight); font-weight: 600; }

/* ---------- Tela de abertura ------------------------------------------- */
.tela-abertura {
  min-height: 70vh;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  text-align: center;
  gap: 40px;
}
.abertura-marca .abertura-numero {
  display: block;
  font-family: var(--fonte-numero);
  font-size: 4rem;
  font-weight: 700;
  color: var(--floodlight);
  line-height: 1;
}
.abertura-marca h1 { font-size: 2.1rem; margin: 6px 0 4px; }
.subt { color: rgba(237, 243, 238, 0.7); }
.abertura-acoes { display: flex; flex-direction: column; gap: 12px; width: 260px; }

/* ---------- Botoes ------------------------------------------------------ */
.btn {
  border: none;
  border-radius: 3px;
  padding: 12px 18px;
  font-size: 0.98rem;
  font-weight: 600;
  cursor: pointer;
  font-family: inherit;
}
.btn-primario { background: var(--floodlight); color: #1A1400; }
.btn-primario:hover { background: #ffd968; }
.btn-secundario { background: var(--pitch-light); color: var(--chalk); border: 1px solid var(--linha); }
.btn-secundario:hover { background: #275e42; }
.btn-perigo { background: transparent; color: var(--card-red); border: 1px solid var(--card-red); }
.btn-perigo:hover { background: rgba(228, 87, 46, 0.12); }

/* ---------- Formulario de criacao --------------------------------------- */
.campo { margin-bottom: 16px; display: flex; flex-direction: column; gap: 6px; }
.campo-linha { display: flex; gap: 16px; }
.campo-linha .campo { flex: 1; }
label { font-size: 0.85rem; color: rgba(237, 243, 238, 0.75); }
input[type="text"], select {
  background: var(--pitch);
  border: 1px solid var(--linha);
  color: var(--chalk);
  padding: 10px 12px;
  border-radius: 3px;
  font-family: inherit;
  font-size: 0.95rem;
}

.grade-estilos { display: grid; grid-template-columns: 1fr; gap: 10px; }
.cartao-estilo {
  border: 1px solid var(--linha);
  background: var(--pitch);
  border-radius: 3px;
  padding: 12px 14px;
  display: flex;
  flex-direction: column;
  gap: 4px;
  cursor: pointer;
}
.cartao-estilo input { margin-right: 8px; }
.cartao-estilo-titulo { font-weight: 700; }
.cartao-estilo-desc { font-size: 0.85rem; color: rgba(237, 243, 238, 0.65); }
.cartao-estilo:has(input:checked) { border-color: var(--floodlight); background: var(--pitch-light); }

#btn-confirmar-criacao { width: 100%; margin-top: 8px; }

/* ---------- Cartao do jogador -------------------------------------------- */
.cartao-jogador {
  display: flex;
  align-items: center;
  gap: 16px;
  background: var(--pitch);
  border: 1px solid var(--linha);
  border-radius: 3px;
  padding: 16px;
  margin: 16px 0;
}
.cartao-jogador-ovr {
  font-family: var(--fonte-numero);
  font-size: 2.4rem;
  font-weight: 700;
  color: var(--floodlight);
  min-width: 64px;
  text-align: center;
}
.cartao-jogador-dados h3 { margin: 0; font-size: 1.15rem; }
.cartao-jogador-dados p { margin: 2px 0; font-size: 0.9rem; }

/* ---------- Tabela da liga ------------------------------------------------ */
.tabela-liga {
  width: 100%;
  border-collapse: collapse;
  font-size: 0.86rem;
  margin: 16px 0;
}
.tabela-liga caption {
  text-align: left;
  color: rgba(237, 243, 238, 0.7);
  font-size: 0.82rem;
  margin-bottom: 6px;
}
.tabela-liga th, .tabela-liga td {
  border-bottom: 1px solid var(--linha);
  padding: 6px 8px;
  text-align: center;
  font-family: var(--fonte-numero);
}
.tabela-liga th:nth-child(2), .tabela-liga td:nth-child(2) { text-align: left; font-family: inherit; }
.tabela-liga .linha-destaque { background: rgba(242, 199, 68, 0.12); }

/* ---------- Barra superior no dashboard ----------------------------------- */
.barra-topo {
  display: flex;
  justify-content: space-between;
  font-size: 0.85rem;
  color: rgba(237, 243, 238, 0.7);
  border-bottom: 1px solid var(--linha);
  padding-bottom: 10px;
  margin-bottom: 4px;
}
.marca { font-family: var(--fonte-numero); letter-spacing: 0.06em; color: var(--floodlight); }

.acoes { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 18px; }

/* ---------- Foco de treino -------------------------------------------------- */
.bloco-foco { margin-top: 18px; }
.linha-foco { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 6px; }
.btn-foco {
  border: 1px solid var(--linha);
  background: var(--pitch);
  color: var(--chalk);
  border-radius: 3px;
  padding: 8px 12px;
  font-size: 0.82rem;
  cursor: pointer;
  font-family: inherit;
}
.btn-foco-ativo { border-color: var(--floodlight); background: var(--pitch-light); color: var(--floodlight); }

/* ---------- Cartoes de clube (mercado) ------------------------------------ */
.lista-clubes { display: flex; flex-direction: column; gap: 10px; margin: 16px 0; }
.cartao-clube {
  border: 1px solid var(--linha);
  background: var(--pitch);
  border-radius: 3px;
  padding: 12px 14px;
  display: flex;
  flex-direction: column;
  gap: 8px;
}
.cartao-clube-topo { display: flex; justify-content: space-between; align-items: baseline; }
.tag {
  font-size: 0.72rem;
  color: rgba(237, 243, 238, 0.65);
  border: 1px solid var(--linha);
  border-radius: 3px;
  padding: 2px 6px;
}
.cartao-clube-info {
  display: flex;
  justify-content: space-between;
  font-size: 0.82rem;
  color: rgba(237, 243, 238, 0.75);
  font-family: var(--fonte-numero);
}
.destaque-projeto { color: var(--floodlight); font-family: var(--fonte-titulo); }

/* ---------- Resultado / avisos --------------------------------------------- */
.grade-stats {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 10px;
  margin: 18px 0;
}
.grade-stats div {
  background: var(--pitch);
  border: 1px solid var(--linha);
  border-radius: 3px;
  padding: 12px 6px;
  text-align: center;
  display: flex;
  flex-direction: column;
  gap: 4px;
}
.grade-stats .numero {
  font-family: var(--fonte-numero);
  font-size: 1.5rem;
  font-weight: 700;
  color: var(--floodlight);
}
.grade-stats span:last-child { font-size: 0.75rem; color: rgba(237, 243, 238, 0.65); }

.aviso {
  background: rgba(228, 87, 46, 0.12);
  border: 1px solid rgba(228, 87, 46, 0.4);
  border-radius: 3px;
  padding: 10px 12px;
  font-size: 0.88rem;
}
.aviso-campeao {
  background: rgba(242, 199, 68, 0.14);
  border-color: rgba(242, 199, 68, 0.5);
}

/* ---------- Responsivo ------------------------------------------------------ */
@media (max-width: 520px) {
  .campo-linha { flex-direction: column; gap: 16px; }
  .grade-stats { grid-template-columns: repeat(2, 1fr); }
  .cartao-jogador { flex-direction: column; align-items: flex-start; }
}

/* ---------- Foco visivel para acessibilidade -------------------------------- */
a:focus-visible, button:focus-visible, input:focus-visible, select:focus-visible {
  outline: 2px solid var(--floodlight);
  outline-offset: 2px;
}

@media (prefers-reduced-motion: reduce) {
  * { transition: none !important; animation: none !important; }
}

/* ==========================================================================
   FUTCAREER — motor do jogo
   Toda a logica de simulacao fica aqui. A tela (app.js) so le o estado
   e chama estas funcoes; nao ha calculo de jogo dentro da UI.

   Fases da carreira do jogador (jogador.fase):
     "base"         — categorias de base (comeca aos 6 anos), sem contrato
     "profissional" — jogador com contrato, disputa a liga do seu clube

   Situacao contratual (jogador.situacaoContratual), valida so na fase pro:
     "normal"     — vinculado normalmente ao clube atual
     "emprestado" — emprestado por outro clube (o "dono" guarda o contrato)
     "livre"      — sem clube, procurando uma nova oportunidade

   Cada meia-temporada (turno) e simulada em ate 3 blocos de rodadas, para
   que o jogador acompanhe o andamento antes de chegar na janela de
   transferencias (que so aparece depois do ultimo bloco do turno).
   ========================================================================== */

const SAVE_KEY = "futcareer_save_v1";
const BLOCOS_POR_TURNO = 3;
const GRUPOS_FOCO = {
  ataque: ["atq", "vel"],
  criacao: ["pas", "dri"],
  fisico: ["fis", "def"],
};

function clamp(v, min, max) { return Math.max(min, Math.min(max, v)); }
function rnd(min, max) { return Math.random() * (max - min) + min; }
function rndInt(min, max) { return Math.floor(rnd(min, max + 1)); }
function pick(arr) { return arr[rndInt(0, arr.length - 1)]; }

/* ---------- Construcao do clube (runtime) ---------------------------- */

function buildClub(base, leagueId, leagueNivel) {
  const investimento = clamp(base.reputacao + rndInt(-16, 16), 12, 99);
  return {
    nome: base.nome,
    ligaId: leagueId,
    nivel: leagueNivel,
    reputacaoBase: base.reputacao,
    reputacao: base.reputacao,
    investimento,
    orcamento: Math.round((base.reputacao * 0.6 + investimento * 0.4) * rnd(0.9, 1.3) * 1_000_000),
    pontos: 0, jogos: 0, vitorias: 0, empates: 0, derrotas: 0,
    golsPro: 0, golsContra: 0,
  };
}

function rotuloProjeto(clube) {
  const diff = clube.investimento - clube.reputacao;
  if (diff >= 15) return "Projeto em forte ascensao";
  if (diff >= 6) return "Investindo para crescer";
  if (diff <= -15) return "Projeto em declinio";
  if (diff <= -6) return "Perdendo forca financeira";
  return "Financeiramente estavel";
}

function novoMundo() {
  const clubes = [];
  for (const liga of LEAGUES) {
    for (const base of liga.clubes) {
      clubes.push(buildClub(base, liga.id, liga.nivel));
    }
  }
  return clubes;
}

function resetarTabela(clubes) {
  for (const c of clubes) {
    c.pontos = 0; c.jogos = 0; c.vitorias = 0; c.empates = 0; c.derrotas = 0;
    c.golsPro = 0; c.golsContra = 0;
  }
}

function clubesDaLiga(clubes, ligaId) {
  return clubes.filter(c => c.ligaId === ligaId);
}

/* ---------- Criacao do jogador ----------------------------------------- */

function criarJogador({ nome, nacionalidade, posicao, estiloId }) {
  const estilo = ESTILOS.find(e => e.id === estiloId) || ESTILOS[0];
  const base = { atq: 20, dri: 20, pas: 20, def: 20, fis: 20, vel: 20 };
  for (const k in base) base[k] += rndInt(-3, 3);
  for (const k in estilo.bonus) base[k] += Math.round(estilo.bonus[k] * 0.4);
  for (const k in base) base[k] = clamp(base[k], 10, 35);

  const potencial = clamp(rndInt(60, 95), 60, 99);
  const ligaInicial = LEAGUES.find(l => l.pais === nacionalidade) || LEAGUES[1];

  return {
    nome, nacionalidade, posicao, estiloId,
    idade: 6,
    atributos: base,
    potencial,
    foco: null,
    fase: "base",
    clubeNome: null,
    ligaIdAtual: null,
    ligaIdPreferida: ligaInicial.id,
    situacaoContratual: "normal",
    clubeDono: null,
    emprestimoAte: null,
    contratoAte: null,
    salario: 0,
    valorDeMercado: 0,
    moral: 70,
    aposentado: false,
    estatisticasTemporada: statsVazias(),
    estatisticasCarreira: statsVazias(),
    estatisticasBase: { jogos: 0, gols: 0 },
    historicoClubes: [],
    titulos: [],
  };
}

function statsVazias() {
  return { jogos: 0, gols: 0, assistencias: 0, notaSoma: 0, jogosComNota: 0, clSheets: 0 };
}

function overall(jogador) {
  const pesos = POSICOES[jogador.posicao].pesos;
  let total = 0;
  for (const attr in pesos) total += jogador.atributos[attr] * pesos[attr];
  return Math.round(clamp(total, 1, 99));
}

function poderDoJogador(jogador) {
  return Math.round(overall(jogador) * 0.75 + jogador.potencial * 0.25);
}

function atualizarValorDeMercado(jogador) {
  const ovr = overall(jogador);
  const fatorIdade = jogador.idade <= 23 ? 1.4 : jogador.idade <= 29 ? 1.0 : jogador.idade <= 33 ? 0.6 : 0.3;
  const base = Math.pow(1.18, ovr - 40) * 150000 * fatorIdade;
  jogador.valorDeMercado = Math.round(base / 10000) * 10000;
}

function definirFoco(jogador, foco) {
  jogador.foco = GRUPOS_FOCO[foco] ? foco : null;
}

/* ---------- Categorias de base ------------------------------------------- */

function candidatosBaseInicial(estado) {
  const jogador = estado.jogador;
  const ligasDoPais = LEAGUES.filter(l => l.pais === jogador.nacionalidade).map(l => l.id);
  const pool = estado.clubes.filter(c => ligasDoPais.includes(c.ligaId));
  const baseUsada = pool.length ? pool : estado.clubes;
  return baseUsada.slice().sort(() => Math.random() - 0.5).slice(0, 6);
}

function clubesInteressadosBase(estado) {
  const jogador = estado.jogador;
  const atual = clubeAtual(estado);
  const alvo = jogador.potencial;
  return estado.clubes
    .filter(c => !atual || c.nome !== atual.nome)
    .map(c => {
      const gapRep = Math.abs(c.reputacao - alvo);
      const bonusInvestimento = clamp((c.investimento - 50) / 40, -0.4, 0.4);
      return { clube: c, gap: gapRep - bonusInvestimento * 5 };
    })
    .filter(x => x.gap <= 22)
    .sort((a, b) => a.gap - b.gap)
    .slice(0, 5)
    .map(x => x.clube);
}

function assinarNaBase(estado, clube) {
  const jogador = estado.jogador;
  jogador.clubeNome = clube.nome;
  jogador.ligaIdAtual = clube.ligaId;
  estado.temporadaInicioNoClube = estado.ano;
}

function chancePromocaoBase(jogador, clube) {
  if (jogador.idade < 15) return 0;
  const ovr = overall(jogador);
  let chance = 0.06 + (jogador.idade - 16) * 0.09;
  chance += clamp((ovr - clube.reputacao * 0.55) / 120, -0.15, 0.35);
  return clamp(chance, 0.03, 0.9);
}

function promoverParaProfissional(estado, clube, forcado) {
  const jogador = estado.jogador;
  jogador.fase = "profissional";
  jogador.clubeNome = clube.nome;
  jogador.ligaIdAtual = clube.ligaId;
  jogador.salario = Math.round(calcularSalarioOferta(clube, jogador) * (forcado ? 0.25 : 0.45));
  jogador.contratoAte = estado.ano + rndInt(2, 3);
  jogador.situacaoContratual = "normal";
  estado.temporadaInicioNoClube = estado.ano;
}

function simularBlocoBase(estado, quantidadeRodadas) {
  const jogador = estado.jogador;
  jogador.estatisticasBase = jogador.estatisticasBase || { jogos: 0, gols: 0 };
  if (jogador.idade < 11) return { jogos: 0, gols: 0 };

  let jogos = 0, gols = 0;
  for (let i = 0; i < quantidadeRodadas; i++) {
    if (Math.random() < 0.85) {
      jogos++;
      if (["ATA", "MEI"].includes(jogador.posicao)) {
        const chanceGol = clamp(jogador.atributos.atq / 220, 0.05, 0.6);
        if (Math.random() < chanceGol) gols++;
      }
    }
  }
  jogador.estatisticasTemporada.jogos += jogos;
  jogador.estatisticasTemporada.gols += gols;
  jogador.estatisticasBase.jogos += jogos;
  jogador.estatisticasBase.gols += gols;
  return { jogos, gols };
}

/* ---------- Mercado de transferencias (profissional) ---------------------- */

function clubeAtual(estado) {
  return estado.clubes.find(c => c.nome === estado.jogador.clubeNome);
}

function clubesInteressados(estado, incluirAtual = false) {
  const jogador = estado.jogador;
  const atual = clubeAtual(estado);
  let poder = poderDoJogador(jogador);

  const d = estado.ultimoDesempenho;
  if (jogador.situacaoContratual !== "livre" && d) {
    if (d.jogos === 0) poder *= 0.72;
    else if (d.media !== null && d.media < 5.6) poder *= 0.85;
    else if (d.media !== null && d.media >= 7.2) poder *= 1.1;
  }

  return estado.clubes
    .filter(c => (incluirAtual ? true : c.nome !== (atual && atual.nome)))
    .map(c => {
      const gapRep = Math.abs(c.reputacao - poder);
      const orcamentoEmMilhoes = c.orcamento / 1_000_000;
      const bonusFinanceiro = clamp((orcamentoEmMilhoes - 40) / 40, -0.5, 0.6);
      return { clube: c, gap: gapRep - bonusFinanceiro * 6 };
    })
    .filter(x => x.gap <= 22 || x.clube.reputacao <= poder + 6)
    .sort((a, b) => a.gap - b.gap)
    .slice(0, 6)
    .map(x => x.clube);
}

function calcularSalarioOferta(clube, jogador) {
  const ovr = overall(jogador);
  const forcaFinanceira = clube.orcamento / 1_000_000;
  const base = (clube.reputacao * 700) + (ovr * 650) + (jogador.potencial * 180) + (forcaFinanceira * 25);
  return Math.round(base / 50) * 50;
}

function assinarComClube(estado, clube) {
  const jogador = estado.jogador;
  if (jogador.clubeNome) {
    jogador.historicoClubes.push({
      clube: jogador.clubeNome,
      de: estado.temporadaInicioNoClube || estado.ano,
      ate: estado.ano,
    });
  }
  jogador.clubeNome = clube.nome;
  jogador.ligaIdAtual = clube.ligaId;
  jogador.salario = calcularSalarioOferta(clube, jogador);
  jogador.contratoAte = estado.ano + rndInt(2, 4);
  jogador.situacaoContratual = "normal";
  jogador.clubeDono = null;
  jogador.emprestimoAte = null;
  estado.temporadaInicioNoClube = estado.ano;
}

/* ---------- Risco contratual: sem propostas, emprestimo, dispensa -------- */

function dispensarJogador(estado) {
  const jogador = estado.jogador;
  jogador.historicoClubes.push({
    clube: jogador.clubeNome,
    de: estado.temporadaInicioNoClube || estado.ano,
    ate: estado.ano,
  });
  jogador.clubeNome = null;
  jogador.ligaIdAtual = null;
  jogador.salario = 0;
  jogador.contratoAte = null;
  jogador.situacaoContratual = "livre";
  jogador.clubeDono = null;
  jogador.emprestimoAte = null;
}

function emprestarJogador(estado) {
  const jogador = estado.jogador;
  const dono = jogador.clubeNome;
  const candidatos = estado.clubes
    .filter(c => c.nome !== dono)
    .map(c => ({ clube: c, gap: Math.abs(c.reputacao - (overall(jogador) - 8)) }))
    .sort((a, b) => a.gap - b.gap)
    .slice(0, 5);
  if (!candidatos.length) return null;
  const destino = pick(candidatos).clube;
  jogador.clubeDono = dono;
  jogador.clubeNome = destino.nome;
  jogador.ligaIdAtual = destino.ligaId;
  jogador.situacaoContratual = "emprestado";
  jogador.emprestimoAte = estado.ano + 1;
  return { dono, clube: destino.nome };
}

function avaliarSituacaoContratual(estado) {
  const jogador = estado.jogador;

  if (jogador.situacaoContratual === "livre") return { tipo: "livre" };

  if (jogador.situacaoContratual === "emprestado") {
    if (jogador.emprestimoAte && estado.ano >= jogador.emprestimoAte) {
      const dono = jogador.clubeDono;
      const clubeDono = estado.clubes.find(c => c.nome === dono);
      jogador.situacaoContratual = "normal";
      jogador.clubeDono = null;
      jogador.emprestimoAte = null;
      if (clubeDono) {
        jogador.clubeNome = clubeDono.nome;
        jogador.ligaIdAtual = clubeDono.ligaId;
        return { tipo: "retorno_emprestimo", clube: dono };
      }
      jogador.situacaoContratual = "livre";
      jogador.clubeNome = null;
      jogador.ligaIdAtual = null;
      return { tipo: "dispensado", motivo: "clube_nao_encontrado" };
    }
    return { tipo: "emprestado_continua" };
  }

  const d = estado.ultimoDesempenho;
  if (!d) return null;

  if (d.jogos === 0) {
    const r = Math.random();
    if (r < 0.28) { dispensarJogador(estado); return { tipo: "dispensado", motivo: "sem_minutos" }; }
    if (r < 0.60) {
      const info = emprestarJogador(estado);
      return info ? { tipo: "emprestado", ...info } : { tipo: "aviso" };
    }
    return { tipo: "aviso" };
  }

  if (d.media !== null && d.media < 5.6) {
    const r = Math.random();
    if (r < 0.16) { dispensarJogador(estado); return { tipo: "dispensado", motivo: "desempenho" }; }
    if (r < 0.38) {
      const info = emprestarJogador(estado);
      return info ? { tipo: "emprestado", ...info } : { tipo: "aviso" };
    }
  }

  if (jogador.contratoAte !== null && estado.ano >= jogador.contratoAte &&
      d.media !== null && d.media < 6.2 && Math.random() < 0.35) {
    dispensarJogador(estado);
    return { tipo: "dispensado", motivo: "fim_contrato" };
  }

  return null;
}

/* ---------- Simulacao de partidas --------------------------------------- */

function forcaClube(clube) {
  return clube.reputacao + rnd(-6, 6);
}

function simularPlacar(forcaA, forcaB) {
  const diff = (forcaA - forcaB) / 12;
  const mediaA = clamp(1.35 + diff * 0.35, 0.3, 3.6);
  const mediaB = clamp(1.35 - diff * 0.35, 0.3, 3.6);
  return [poisson(mediaA), poisson(mediaB)];
}

function poisson(lambda) {
  let L = Math.exp(-lambda), k = 0, p = 1;
  do { k++; p *= Math.random(); } while (p > L && k < 9);
  return k - 1;
}

function registrarResultado(clube, golsPro, golsContra) {
  clube.jogos++; clube.golsPro += golsPro; clube.golsContra += golsContra;
  if (golsPro > golsContra) { clube.vitorias++; clube.pontos += 3; }
  else if (golsPro === golsContra) { clube.empates++; clube.pontos += 1; }
  else { clube.derrotas++; }
}

function gerarRodadasNomes(clubes) {
  const nomes = clubes.map(c => c.nome);
  if (nomes.length % 2 !== 0) nomes.push(null);
  const n = nomes.length;
  const rodadas = [];
  for (let r = 0; r < n - 1; r++) {
    const jogosRodada = [];
    for (let i = 0; i < n / 2; i++) {
      const a = nomes[i], b = nomes[n - 1 - i];
      if (a && b) jogosRodada.push([a, b]);
    }
    rodadas.push(jogosRodada);
    nomes.splice(1, 0, nomes.pop());
  }
  return rodadas;
}

function chanceTitularClube(jogador, clube) {
  const ovr = overall(jogador);
  return clamp(0.35 + (ovr - clube.reputacao) / 90, 0.08, 0.97);
}

function simularParticipacaoJogador(estado, foiCasa, golsTime, golsAdversario) {
  const jogador = estado.jogador;
  const clube = clubeAtual(estado);
  const titular = Math.random() < chanceTitularClube(jogador, clube);
  const stats = jogador.estatisticasTemporada;

  if (!titular) return;

  stats.jogos++;
  jogador.estatisticasCarreira.jogos++;

  let nota = 6.0 + rnd(-0.6, 0.6);

  if (["ATA", "MEI"].includes(jogador.posicao) && golsTime > 0) {
    const chanceGolPorGolTime = jogador.atributos.atq / 260;
    let golsMarcados = 0;
    for (let i = 0; i < golsTime; i++) if (Math.random() < chanceGolPorGolTime) golsMarcados++;
    if (golsMarcados > 0) {
      stats.gols += golsMarcados;
      jogador.estatisticasCarreira.gols += golsMarcados;
      nota += golsMarcados * 0.5;
    }
    if (Math.random() < jogador.atributos.pas / 320 && golsTime > golsMarcados) {
      stats.assistencias += 1;
      jogador.estatisticasCarreira.assistencias += 1;
      nota += 0.3;
    }
  }

  if (["GOL", "ZAG", "LAT", "VOL"].includes(jogador.posicao) && golsAdversario === 0) {
    stats.clSheets++;
    jogador.estatisticasCarreira.clSheets++;
    nota += 0.4;
  }
  if (["GOL", "ZAG", "LAT", "VOL"].includes(jogador.posicao)) {
    nota -= golsAdversario * 0.15;
  }

  nota = clamp(nota, 3.0, 10.0);
  stats.notaSoma += nota; stats.jogosComNota++;
  jogador.estatisticasCarreira.notaSoma += nota;
  jogador.estatisticasCarreira.jogosComNota++;
}

/* ---------- Simulacao em blocos, com checkpoints dentro do turno --------- */

function garantirRodadasDaTemporada(estado) {
  const chave = `${estado.ano}-${estado.turno}`;
  if (estado.rodadasChave === chave && estado.rodadasPorLiga) return;

  const idsLigas = [...new Set(estado.clubes.map(c => c.ligaId))];
  const porLiga = {};
  let maxRodadas = 0;
  for (const ligaId of idsLigas) {
    const liga = clubesDaLiga(estado.clubes, ligaId);
    const rs = gerarRodadasNomes(liga);
    porLiga[ligaId] = rs;
    maxRodadas = Math.max(maxRodadas, rs.length);
  }

  estado.rodadasChave = chave;
  estado.rodadasPorLiga = porLiga;
  estado.indiceRodada = 0;
  estado.maxRodadas = maxRodadas;
  estado.faseTurnoNoInicio = estado.jogador.fase;
  estado.jogador.estatisticasTemporada = statsVazias();
}

function simularProximoBloco(estado) {
  garantirRodadasDaTemporada(estado);
  const jogador = estado.jogador;
  const faseNoInicio = estado.faseTurnoNoInicio;
  const nomeClubeJogador = jogador.clubeNome;
  const porNome = new Map(estado.clubes.map(c => [c.nome, c]));

  const tamanhoBloco = Math.max(1, Math.ceil(estado.maxRodadas / BLOCOS_POR_TURNO));
  const inicio = estado.indiceRodada;
  const fim = Math.min(estado.maxRodadas, inicio + tamanhoBloco);

  const jogosAntes = jogador.estatisticasTemporada.jogos;
  const golsAntes = jogador.estatisticasTemporada.gols;
  const assistAntes = jogador.estatisticasTemporada.assistencias;
  const partidasDoBloco = [];

  for (let idx = inicio; idx < fim; idx++) {
    for (const ligaId in estado.rodadasPorLiga) {
      const rodadas = estado.rodadasPorLiga[ligaId];
      if (idx >= rodadas.length) continue;
      for (const [nomeA, nomeB] of rodadas[idx]) {
        const a = porNome.get(nomeA), b = porNome.get(nomeB);
        if (!a || !b) continue;
        const [golsA, golsB] = simularPlacar(forcaClube(a), forcaClube(b));
        registrarResultado(a, golsA, golsB);
        registrarResultado(b, golsB, golsA);
        if (faseNoInicio === "profissional" && nomeClubeJogador) {
          if (a.nome === nomeClubeJogador) {
            const antes = jogador.estatisticasTemporada.jogos;
            simularParticipacaoJogador(estado, true, golsA, golsB);
            if (jogador.estatisticasTemporada.jogos > antes) partidasDoBloco.push({ adversario: nomeB, placar: `${golsA}-${golsB}` });
          }
          if (b.nome === nomeClubeJogador) {
            const antes = jogador.estatisticasTemporada.jogos;
            simularParticipacaoJogador(estado, false, golsB, golsA);
            if (jogador.estatisticasTemporada.jogos > antes) partidasDoBloco.push({ adversario: nomeA, placar: `${golsB}-${golsA}` });
          }
        }
      }
    }
  }

  let jogosBaseBloco = { jogos: 0, gols: 0 };
  if (faseNoInicio === "base") {
    jogosBaseBloco = simularBlocoBase(estado, fim - inicio);
  }

  estado.indiceRodada = fim;
  const concluido = fim >= estado.maxRodadas;

  const deltaBloco = {
    jogos: jogador.estatisticasTemporada.jogos - jogosAntes,
    gols: jogador.estatisticasTemporada.gols - golsAntes,
    assistencias: jogador.estatisticasTemporada.assistencias - assistAntes,
    partidas: partidasDoBloco,
    jogosBase: jogosBaseBloco,
  };

  let resultadoFinal = null;
  if (concluido) resultadoFinal = finalizarMeiaTemporada(estado, faseNoInicio);

  return {
    concluido, deltaBloco, resultadoFinal, faseNoInicio,
    rodadaAtual: fim, totalRodadas: estado.maxRodadas,
  };
}

function finalizarMeiaTemporada(estado, faseNoInicio) {
  const jogador = estado.jogador;
  const lesionou = faseNoInicio === "profissional" && Math.random() < 0.08;

  crescerAtributos(jogador);
  atualizarValorDeMercado(jogador);

  estado.ultimoDesempenho = {
    jogos: jogador.estatisticasTemporada.jogos,
    media: jogador.estatisticasTemporada.jogosComNota
      ? jogador.estatisticasTemporada.notaSoma / jogador.estatisticasTemporada.jogosComNota
      : null,
  };

  estado.eventoPromocao = null;
  estado.eventoContratual = null;

  if (faseNoInicio === "base") {
    const clube = clubeAtual(estado);
    if (clube) {
      const chance = chancePromocaoBase(jogador, clube);
      const forcarPromocao = jogador.idade >= 20;
      if (Math.random() < chance || forcarPromocao) {
        const forcado = forcarPromocao && Math.random() >= chance;
        promoverParaProfissional(estado, clube, forcado);
        estado.eventoPromocao = { clube: clube.nome, forcado };
      }
    }
  } else if (faseNoInicio === "profissional") {
    estado.eventoContratual = avaliarSituacaoContratual(estado);
  }

  estado.rodadasPorLiga = null;
  estado.rodadasChave = null;

  return { lesionou, faseNoInicio };
}

function crescerAtributos(jogador) {
  const stats = jogador.estatisticasTemporada;
  const desempenho = stats.jogosComNota > 0 ? stats.notaSoma / stats.jogosComNota : 6.0;
  let delta = 0;
  if (jogador.idade <= 20) delta = rnd(1.0, 2.6);
  else if (jogador.idade <= 23) delta = rnd(0.4, 1.6);
  else if (jogador.idade <= 29) delta = rnd(-0.2, 0.6);
  else if (jogador.idade <= 32) delta = rnd(-1.0, 0.1);
  else delta = rnd(-2.2, -0.6);

  if (desempenho >= 7.0) delta += 0.4;
  if (desempenho <= 5.6 && stats.jogosComNota > 0) delta -= 0.3;

  const atributosFoco = jogador.foco ? (GRUPOS_FOCO[jogador.foco] || []) : [];
  const tetoPotencial = jogador.potencial;
  for (const k in jogador.atributos) {
    let deltaAttr = delta * rnd(0.6, 1.2);
    if (atributosFoco.includes(k)) deltaAttr *= 1.5;
    const alvo = jogador.atributos[k] + deltaAttr;
    jogador.atributos[k] = clamp(alvo, 10, Math.min(99, tetoPotencial + 8));
  }
}

function tabelaOrdenada(clubes, ligaId) {
  return clubesDaLiga(clubes, ligaId)
    .slice()
    .sort((a, b) => (b.pontos - a.pontos) || ((b.golsPro - b.golsContra) - (a.golsPro - a.golsContra)));
}

function evoluirClubes(estado) {
  const idsLigas = [...new Set(estado.clubes.map(c => c.ligaId))];
  for (const ligaId of idsLigas) {
    const tabela = tabelaOrdenada(estado.clubes, ligaId);
    const n = tabela.length;
    if (n < 2) continue;
    tabela.forEach((c, i) => {
      const posRelativa = i / (n - 1);
      const fatorResultado = 0.5 - posRelativa;

      const deltaOrcamento = fatorResultado * 0.05 + (c.investimento - 50) / 900;
      c.orcamento = Math.max(1_500_000, Math.round(c.orcamento * (1 + deltaOrcamento)));

      const alvo = clamp(c.investimento + fatorResultado * 10, 15, 99);
      c.reputacao = clamp(c.reputacao + (alvo - c.reputacao) * 0.12, 18, 99);
    });
  }
}

function aplicarPromocaoRebaixamento(estado) {
  const movimentos = [];
  for (const par of PARES_DIVISAO) {
    const tabelaSuperior = tabelaOrdenada(estado.clubes, par.superior);
    const tabelaInferior = tabelaOrdenada(estado.clubes, par.inferior);
    const rebaixados = tabelaSuperior.slice(-par.qtd);
    const promovidos = tabelaInferior.slice(0, par.qtd);

    for (const c of rebaixados) {
      c.ligaId = par.inferior; c.nivel = 2;
      movimentos.push({ clube: c.nome, de: par.superior, para: par.inferior, subiu: false });
    }
    for (const c of promovidos) {
      c.ligaId = par.superior; c.nivel = 1;
      movimentos.push({ clube: c.nome, de: par.inferior, para: par.superior, subiu: true });
    }
  }
  return movimentos;
}

/* ---------- Ciclo de temporada ------------------------------------------- */

function avancarParaProximaJanela(estado) {
  const jogador = estado.jogador;
  estado.movimentosDivisao = [];

  if (estado.turno === 1) {
    estado.turno = 2;
  } else {
    const ligaAtualId = jogador.ligaIdAtual || jogador.ligaIdPreferida;
    const tabela = tabelaOrdenada(estado.clubes, ligaAtualId);
    const campeao = tabela[0];
    estado.ultimoCampeao = campeao ? campeao.nome : null;
    if (campeao && campeao.nome === jogador.clubeNome) {
      const liga = LEAGUES.find(l => l.id === ligaAtualId);
      jogador.titulos.push(`${estado.ano} — Campeao (${liga ? liga.nome : ligaAtualId})`);
    }

    if (jogador.fase === "profissional") {
      const inicio = estado.statsInicioTemporada || statsVazias();
      const golsTemporada = jogador.estatisticasCarreira.gols - inicio.gols;
      const notaSomaTemporada = jogador.estatisticasCarreira.notaSoma - inicio.notaSoma;
      const jogosComNotaTemporada = jogador.estatisticasCarreira.jogosComNota - inicio.jogosComNota;
      const mediaTemporada = jogosComNotaTemporada > 0 ? notaSomaTemporada / jogosComNotaTemporada : null;

      if (golsTemporada >= 20) {
        jogador.titulos.push(`${estado.ano} — Artilheiro da temporada (${golsTemporada} gols)`);
      }
      if (mediaTemporada !== null && jogosComNotaTemporada >= 20 && mediaTemporada >= 7.6) {
        jogador.titulos.push(`${estado.ano} — Eleito o melhor jogador da temporada`);
      }
    }

    evoluirClubes(estado);
    estado.movimentosDivisao = aplicarPromocaoRebaixamento(estado);
    resetarTabela(estado.clubes);

    const clubeDoJogador = estado.clubes.find(c => c.nome === jogador.clubeNome);
    if (clubeDoJogador) jogador.ligaIdAtual = clubeDoJogador.ligaId;

    estado.ano += 1;
    estado.turno = 1;
    jogador.idade += 1;
    estado.statsInicioTemporada = { ...jogador.estatisticasCarreira };
  }
}

function jogadorDeveConsiderarAposentadoria(jogador) {
  return jogador.fase === "profissional" && jogador.idade >= 33;
}

function aposentar(jogador) {
  jogador.aposentado = true;
}

/* ---------- Salvar / carregar --------------------------------------------- */

function salvarEstado(estado) {
  try {
    localStorage.setItem(SAVE_KEY, JSON.stringify(estado));
    return true;
  } catch (e) { return false; }
}

function carregarEstado() {
  try {
    const raw = localStorage.getItem(SAVE_KEY);
    return raw ? JSON.parse(raw) : null;
  } catch (e) { return null; }
}

function apagarEstado() {
  try { localStorage.removeItem(SAVE_KEY); } catch (e) { /* noop */ }
}

      ${cartaoJogadorHTML()}
      ${j.idade < 11 ? `<p class="texto-apoio">Ainda muito novo para jogos oficiais: o foco e o treino e a diversao com a bola.</p>` : `<p class="texto-apoio">Voce ja disputa jogos pela categoria de base.</p>`}
      <p class="texto-apoio">Time principal do clube que revela o seu jogador:</p>
      ${tabelaHTML()}
      ${seletorFocoHTML()}
      <div class="acoes">
        <button class="btn btn-primario" id="btn-simular">Simular proximas rodadas</button>
        <button class="btn btn-secundario" id="btn-carreira">Ver estatisticas de carreira</button>
      </div>
    </section>
  `;
  document.getElementById("btn-simular").addEventListener("click", handleSimular);
  document.getElementById("btn-carreira").addEventListener("click", telaResumoCarreira);
  ligarSeletorFoco();
}

function telaDashboardProfissional() {
  const j = estado.jogador;
  const podeAposentar = jogadorDeveConsiderarAposentadoria(j);
  app.innerHTML = `
    <section class="tela tela-dashboard">
      <header class="barra-topo">
        <span class="marca">FUTCAREER</span>
        <span>${estado.ano} · ${estado.turno === 1 ? "1º turno" : "2º turno"}</span>
      </header>
      ${cartaoJogadorHTML()}
      ${tabelaHTML()}
      ${seletorFocoHTML()}
      <div class="acoes">
        <button class="btn btn-primario" id="btn-simular">Simular proximas rodadas</button>
        <button class="btn btn-secundario" id="btn-carreira">Ver estatisticas de carreira</button>
        ${podeAposentar ? `<button class="btn btn-perigo" id="btn-aposentar">Encerrar carreira</button>` : ""}
      </div>
    </section>
  `;
  document.getElementById("btn-simular").addEventListener("click", handleSimular);
  document.getElementById("btn-carreira").addEventListener("click", telaResumoCarreira);
  const btnAposentar = document.getElementById("btn-aposentar");
  if (btnAposentar) btnAposentar.addEventListener("click", () => {
    aposentar(j);
    salvarEstado(estado);
    telaResumoCarreira();
  });
  ligarSeletorFoco();
}

function telaSemClube() {
  const j = estado.jogador;
  app.innerHTML = `
    <section class="tela tela-dashboard">
      <header class="barra-topo">
        <span class="marca">FUTCAREER</span>
        <span>${estado.ano} · ${estado.turno === 1 ? "1º turno" : "2º turno"}</span>
      </header>
      ${cartaoJogadorHTML()}
      <p class="aviso">Voce esta sem clube no momento. Procure uma nova oportunidade no mercado.</p>
      <div class="acoes">
        <button class="btn btn-primario" id="btn-mercado">Procurar clube</button>
        <button class="btn btn-secundario" id="btn-carreira">Ver estatisticas de carreira</button>
        ${jogadorDeveConsiderarAposentadoria(j) ? `<button class="btn btn-perigo" id="btn-aposentar">Encerrar carreira</button>` : ""}
      </div>
    </section>
  `;
  document.getElementById("btn-mercado").addEventListener("click", () => telaMercado(false));
  document.getElementById("btn-carreira").addEventListener("click", telaResumoCarreira);
  const btnAposentar = document.getElementById("btn-aposentar");
  if (btnAposentar) btnAposentar.addEventListener("click", () => {
    aposentar(j);
    salvarEstado(estado);
    telaResumoCarreira();
  });
}

/* ---------- Andamento da temporada (checkpoints antes do fim do turno) --- */

function telaAndamento(bloco) {
  if (bloco.faseNoInicio === "base") return telaAndamentoBase(bloco);
  telaAndamentoProfissional(bloco);
}

function telaAndamentoBase(bloco) {
  const j = estado.jogador;
  const d = bloco.deltaBloco;
  app.innerHTML = `
    <section class="tela tela-andamento">
      <header class="barra-topo">
        <span class="marca">FUTCAREER</span>
        <span>${estado.ano} · ${estado.turno === 1 ? "1º turno" : "2º turno"} · rodada ${bloco.rodadaAtual}/${bloco.totalRodadas}</span>
      </header>
      ${cartaoJogadorHTML()}
      ${j.idade >= 11 ? `
        <h3>Neste trecho</h3>
        <div class="grade-stats">
          <div><span class="numero">${d.jogosBase.jogos}</span><span>Jogos na base</span></div>
          <div><span class="numero">${d.jogosBase.gols}</span><span>Gols na base</span></div>
        </div>
        <p class="texto-apoio">Acumulado na temporada: ${j.estatisticasTemporada.jogos} jogos, ${j.estatisticasTemporada.gols} gols.</p>
      ` : `<p class="texto-apoio">Voce segue treinando enquanto o time principal do seu clube disputa a temporada:</p>`}
      ${tabelaHTML()}
      <button class="btn btn-primario" id="btn-continuar-simulando">Continuar temporada</button>
    </section>
  `;
  document.getElementById("btn-continuar-simulando").addEventListener("click", handleSimular);
}

function telaAndamentoProfissional(bloco) {
  const j = estado.jogador;
  const d = bloco.deltaBloco;
  const stats = j.estatisticasTemporada;
  const media = stats.jogosComNota ? (stats.notaSoma / stats.jogosComNota).toFixed(1) : "—";
  const partidasTxt = d.partidas.length
    ? d.partidas.map(p => `vs ${p.adversario} (${p.placar})`).join(" · ")
    : "Voce ficou no banco neste trecho.";

  app.innerHTML = `
    <section class="tela tela-andamento">
      <header class="barra-topo">
        <span class="marca">FUTCAREER</span>
        <span>${estado.ano} · ${estado.turno === 1 ? "1º turno" : "2º turno"} · rodada ${bloco.rodadaAtual}/${bloco.totalRodadas}</span>
      </header>
      ${cartaoJogadorHTML()}
      <h3>Neste trecho</h3>
      <div class="grade-stats">
        <div><span class="numero">${d.jogos}</span><span>Jogos</span></div>
        <div><span class="numero">${d.gols}</span><span>Gols</span></div>
        <div><span class="numero">${d.assistencias}</span><span>Assistencias</span></div>
      </div>
      <p class="texto-apoio">${partidasTxt}</p>
      <h3>Acumulado na temporada</h3>
      <div class="grade-stats">
        <div><span class="numero">${stats.jogos}</span><span>Jogos</span></div>
        <div><span class="numero">${stats.gols}</span><span>Gols</span></div>
        <div><span class="numero">${stats.assistencias}</span><span>Assistencias</span></div>
        <div><span class="numero">${media}</span><span>Nota media</span></div>
      </div>
      ${tabelaHTML()}
      <button class="btn btn-primario" id="btn-continuar-simulando">Continuar temporada</button>
    </section>
  `;
  document.getElementById("btn-continuar-simulando").addEventListener("click", handleSimular);
}

/* ---------- Resultado do turno (roteador por fase) ------------------------ */

function telaResultado(resultado) {
  if (resultado.faseNoInicio === "base") return telaResultadoBase(resultado);
  return telaResultadoProfissional(resultado);
}

function telaResultadoBase(resultado) {
  const j = estado.jogador;
  const promo = estado.eventoPromocao;
  const stats = j.estatisticasTemporada;
  app.innerHTML = `
    <section class="tela tela-resultado">
      <h2>Fim do ${estado.turno === 1 ? "1º" : "2º"} turno — ${estado.ano} (categoria de base)</h2>
      ${cartaoJogadorHTML()}
      ${j.idade >= 11 ? `
        <div class="grade-stats">
          <div><span class="numero">${stats.jogos}</span><span>Jogos na base</span></div>
          <div><span class="numero">${stats.gols}</span><span>Gols na base</span></div>
        </div>
      ` : `<p class="texto-apoio">Ainda muito novo para jogos oficiais — o foco e o treino e o desenvolvimento.</p>`}
      <p class="texto-apoio">Potencial estimado pela comissao tecnica: ${j.potencial}</p>
      ${promo
        ? `<p class="aviso aviso-campeao">${promo.forcado
            ? `Sem grandes garantias, mas voce assinou seu primeiro contrato profissional com o <strong>${promo.clube}</strong>.`
            : `Voce foi promovido ao elenco profissional do <strong>${promo.clube}</strong>!`}</p>`
        : `<p class="texto-apoio">Ainda nas categorias de base. Continue treinando para ganhar uma chance no time principal.</p>`}
      <button class="btn btn-primario" id="btn-para-mercado">Continuar</button>
    </section>
  `;
  document.getElementById("btn-para-mercado").addEventListener("click", () => {
    const anoAntes = estado.ano;
    avancarParaProximaJanela(estado);
    salvarEstado(estado);
    telaMercado(anoAntes !== estado.ano);
  });
}

function telaResultadoProfissional(resultado) {
  const j = estado.jogador;
  const stats = j.estatisticasTemporada;
  const media = stats.jogosComNota ? (stats.notaSoma / stats.jogosComNota).toFixed(1) : "—";
  const ec = estado.eventoContratual;

  let mensagemContratual = "";
  if (ec) {
    if (ec.tipo === "dispensado") {
      const motivos = {
        sem_minutos: "poucas chances de jogo",
        desempenho: "baixo desempenho em campo",
        fim_contrato: "fim de contrato sem renovacao",
        clube_nao_encontrado: "reestruturacao do clube",
      };
      mensagemContratual = `<p class="aviso">Seu contrato foi rescindido (${motivos[ec.motivo] || "decisao do clube"}). Voce esta sem clube.</p>`;
    } else if (ec.tipo === "emprestado") {
      mensagemContratual = `<p class="aviso">Voce foi emprestado pelo <strong>${ec.dono}</strong> ao <strong>${ec.clube}</strong>.</p>`;
    } else if (ec.tipo === "retorno_emprestimo") {
      mensagemContratual = `<p class="aviso aviso-campeao">Seu emprestimo terminou — voce voltou ao <strong>${ec.clube}</strong>.</p>`;
    } else if (ec.tipo === "aviso") {
      mensagemContratual = `<p class="aviso">Voce teve poucas chances nesse turno. A comissao tecnica esta de olho no seu desempenho.</p>`;
    }
  }

  const novosTitulos = (j.titulos || []).filter(t => t.startsWith(`${estado.ano} —`));
  const mensagemTitulos = novosTitulos.length
    ? `<p class="aviso aviso-campeao">${novosTitulos.join("<br>")}</p>` : "";

  app.innerHTML = `
    <section class="tela tela-resultado">
      <h2>Fim do ${estado.turno === 1 ? "1º" : "2º"} turno — ${estado.ano}</h2>
      <div class="grade-stats">
        <div><span class="numero">${stats.jogos}</span><span>Jogos</span></div>
        <div><span class="numero">${stats.gols}</span><span>Gols</span></div>
        <div><span class="numero">${stats.assistencias}</span><span>Assistencias</span></div>
        <div><span class="numero">${media}</span><span>Nota media</span></div>
      </div>
      ${resultado.lesionou ? `<p class="aviso">Voce sofreu uma lesao ao longo do turno e desfalcou o time em algumas partidas.</p>` : ""}
      ${mensagemContratual}
      ${mensagemTitulos}
      ${tabelaHTML()}
      <button class="btn btn-primario" id="btn-para-mercado">Ir para a janela de transferencias</button>
    </section>
  `;
  document.getElementById("btn-para-mercado").addEventListener("click", () => {
    const anoAntes = estado.ano;
    avancarParaProximaJanela(estado);
    salvarEstado(estado);
    telaMercado(anoAntes !== estado.ano);
  });
}

/* ---------- Janela de transferencias (roteador por fase/situacao) --------- */

function telaMercado(temporadaVirou) {
  const j = estado.jogador;
  if (j.fase === "base") return telaMercadoBase();
  if (j.situacaoContratual === "emprestado") return telaMercadoEmprestado(temporadaVirou);
  if (j.situacaoContratual === "livre") return telaMercadoLivre(temporadaVirou);
  telaMercadoNormal(temporadaVirou);
}

function cartaoClubeHTML(c, { rotulo, extra }) {
  const orcamentoM = Math.round(c.orcamento / 1_000_000);
  return `
    <div class="cartao-clube">
      <div class="cartao-clube-topo">
        <strong>${c.nome}</strong>
        <span class="tag">${nomeLiga(c.ligaId)}</span>
      </div>
      <div class="cartao-clube-info">
        <span>Reputacao: ${Math.round(c.reputacao)}</span>
        <span>Orcamento: R$ ${orcamentoM}M</span>
      </div>
      <div class="cartao-clube-info">
        <span class="destaque-projeto">${rotuloProjeto(c)}</span>
        ${extra ? `<span>${extra}</span>` : ""}
      </div>
      <button class="btn btn-secundario" data-clube="${c.nome}">${rotulo}</button>
    </div>
  `;
}

function telaMercadoBase() {
  const j = estado.jogador;
  const atual = clubeAtual(estado);
  const opcoes = atual ? clubesInteressadosBase(estado) : candidatosBaseInicial(estado);
  const cartoes = opcoes.map(c => cartaoClubeHTML(c, {
    rotulo: atual ? "Transferir para a base" : "Entrar na base",
    extra: `Time principal na ${nomeLiga(c.ligaId)}`,
  })).join("");

  app.innerHTML = `
    <section class="tela tela-mercado">
      <h2>Categorias de base</h2>
      ${atual
        ? `<p class="texto-apoio">Voce esta na base do <strong>${atual.nome}</strong>, ${j.idade} anos.</p>`
        : `<p class="texto-apoio">Escolha um clube para comecar nas categorias de base:</p>`}
      <div class="lista-clubes">${cartoes || "<p class='texto-apoio'>Nenhuma proposta de base no momento.</p>"}</div>
      ${atual ? `<button class="btn btn-primario" id="btn-permanecer">Permanecer na base</button>` : ""}
    </section>
  `;

  document.querySelectorAll("[data-clube]").forEach(btn => {
    btn.addEventListener("click", () => {
      const clube = estado.clubes.find(c => c.nome === btn.dataset.clube);
      assinarNaBase(estado, clube);
      salvarEstado(estado);
      telaDashboard();
    });
  });
  const btnPermanecer = document.getElementById("btn-permanecer");
  if (btnPermanecer) btnPermanecer.addEventListener("click", () => { salvarEstado(estado); telaDashboard(); });
}

function telaMercadoEmprestado(temporadaVirou) {
  const j = estado.jogador;
  app.innerHTML = `
    <section class="tela tela-mercado">
      ${temporadaVirou && estado.ultimoCampeao ? `<p class="aviso aviso-campeao">Campeao de ${estado.ano - 1}: <strong>${estado.ultimoCampeao}</strong></p>` : ""}
      <h2>Emprestado</h2>
      <p class="texto-apoio">Voce esta emprestado pelo <strong>${j.clubeDono}</strong> ao <strong>${j.clubeNome}</strong>, retorno previsto para ${j.emprestimoAte}.</p>
      <button class="btn btn-primario" id="btn-continuar">Continuar</button>
    </section>
  `;
  document.getElementById("btn-continuar").addEventListener("click", () => { salvarEstado(estado); telaDashboard(); });
}

function telaMercadoLivre(temporadaVirou) {
  const j = estado.jogador;
  const opcoes = clubesInteressados(estado, false);
  const cartoes = opcoes.map(c => cartaoClubeHTML(c, {
    rotulo: "Assinar contrato",
    extra: `Salario estimado: R$ ${calcularSalarioOferta(c, j).toLocaleString("pt-BR")}/mes`,
  })).join("");

  app.innerHTML = `
    <section class="tela tela-mercado">
      ${temporadaVirou && estado.ultimoCampeao ? `<p class="aviso aviso-campeao">Campeao de ${estado.ano - 1}: <strong>${estado.ultimoCampeao}</strong></p>` : ""}
      <h2>Sem clube</h2>
      <p class="texto-apoio">Propostas disponiveis no momento:</p>
      <div class="lista-clubes">${cartoes || "<p class='texto-apoio'>Nenhum clube disposto a contratar agora. Tente novamente na proxima janela.</p>"}</div>
      <button class="btn btn-secundario" id="btn-aguardar">Aguardar proxima janela</button>
    </section>
  `;

  document.querySelectorAll("[data-clube]").forEach(btn => {
    btn.addEventListener("click", () => {
      const clube = estado.clubes.find(c => c.nome === btn.dataset.clube);
      assinarComClube(estado, clube);
      salvarEstado(estado);
      telaDashboard();
    });
  });
  document.getElementById("btn-aguardar").addEventListener("click", () => {
    const bloco = simularProximoBloco(estado);
    if (!bloco.concluido) { salvarEstado(estado); telaAndamento(bloco); return; }
    avancarParaProximaJanela(estado);
    salvarEstado(estado);
    telaMercado(true);
  });
}

function telaMercadoNormal(temporadaVirou) {
  const j = estado.jogador;
  const atual = clubeAtual(estado);
  const movimentoDoClube = (estado.movimentosDivisao || []).find(m => m.clube === (atual && atual.nome));
  const opcoes = clubesInteressados(estado, false);
  const cartoes = opcoes.map(c => cartaoClubeHTML(c, {
    rotulo: "Assinar",
    extra: `Salario estimado: R$ ${calcularSalarioOferta(c, j).toLocaleString("pt-BR")}/mes`,
  })).join("");

  app.innerHTML = `
    <section class="tela tela-mercado">
      ${temporadaVirou && estado.ultimoCampeao ? `<p class="aviso aviso-campeao">Campeao de ${estado.ano - 1}: <strong>${estado.ultimoCampeao}</strong>${estado.ultimoCampeao === (atual && atual.nome) ? " — parabens, voce e campeao!" : ""}</p>` : ""}
      ${movimentoDoClube ? `<p class="aviso ${movimentoDoClube.subiu ? "aviso-campeao" : ""}">${atual.nome} ${movimentoDoClube.subiu ? "foi promovido para" : "foi rebaixado para"} <strong>${nomeLiga(movimentoDoClube.para)}</strong>.</p>` : ""}
      <h2>Janela de transferencias</h2>
      <p class="texto-apoio">Clube atual: <strong>${atual ? atual.nome : "—"}</strong> · Contrato ate ${j.contratoAte}</p>
      <div class="lista-clubes">
        ${cartoes || "<p class='texto-apoio'>Nenhum clube com interesse forte no momento — seu desempenho recente afastou propostas.</p>"}
      </div>
      <button class="btn btn-primario" id="btn-permanecer">Permanecer no clube atual</button>
    </section>
  `;

  document.querySelectorAll("[data-clube]").forEach(btn => {
    btn.addEventListener("click", () => {
      const clube = estado.clubes.find(c => c.nome === btn.dataset.clube);
      assinarComClube(estado, clube);
      salvarEstado(estado);
      telaDashboard();
    });
  });
  document.getElementById("btn-permanecer").addEventListener("click", () => {
    salvarEstado(estado);
    telaDashboard();
  });
}

/* ---------- Resumo de carreira --------------------------------------------- */

function telaResumoCarreira() {
  const j = estado.jogador;
  const c = j.estatisticasCarreira;
  const b = j.estatisticasBase || { jogos: 0, gols: 0 };
  const media = c.jogosComNota ? (c.notaSoma / c.jogosComNota).toFixed(1) : "—";
  const historico = [...j.historicoClubes, j.clubeNome ? { clube: j.clubeNome, de: estado.temporadaInicioNoClube, ate: estado.ano } : null]
    .filter(Boolean)
    .map(h => `<li>${h.clube} (${h.de}–${j.aposentado ? estado.ano : "atual"})</li>`).join("");
  const titulos = j.titulos.length ? `<ul>${j.titulos.map(t => `<li>${t}</li>`).join("")}</ul>` : "<p class='texto-apoio'>Nenhum titulo ainda.</p>";

  app.innerHTML = `
    <section class="tela tela-resumo">
      <h2>${j.aposentado ? "Carreira encerrada" : "Estatisticas de carreira"}</h2>
      ${cartaoJogadorHTML()}
      ${b.jogos > 0 ? `<p class="texto-apoio">Nas categorias de base: ${b.jogos} jogos, ${b.gols} gols.</p>` : ""}
      <div class="grade-stats">
        <div><span class="numero">${c.jogos}</span><span>Jogos (pro)</span></div>
        <div><span class="numero">${c.gols}</span><span>Gols (pro)</span></div>
        <div><span class="numero">${c.assistencias}</span><span>Assistencias</span></div>
        <div><span class="numero">${media}</span><span>Nota media</span></div>
      </div>
      <h3>Titulos e premios</h3>
      ${titulos}
      <h3>Clubes</h3>
      <ul>${historico || "<li>Nenhum ainda.</li>"}</ul>
      <div class="acoes">
        ${j.aposentado
          ? `<button class="btn btn-primario" id="btn-nova-vida">Comecar nova carreira</button>`
          : `<button class="btn btn-secundario" id="btn-voltar">Voltar</button>`}
      </div>
    </section>
  `;

  const btnVoltar = document.getElementById("btn-voltar");
  if (btnVoltar) btnVoltar.addEventListener("click", telaDashboard);
  const btnNovaVida = document.getElementById("btn-nova-vida");
  if (btnNovaVida) btnNovaVida.addEventListener("click", () => { apagarEstado(); iniciarTela(); });
}

iniciarTela();
</script>
</body>
</html>
